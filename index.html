    <style>
      /* General Styles */
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #f3ec78, #af4261);
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .container {
        width: 90%;
        max-width: 450px;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        padding: 25px;
        text-align: center;
        position: relative;
        overflow: hidden;
        animation: fade-in 1s ease-out; /* Apply fade-in animation */
      }

      .logo img {
        max-width: 120px;
        margin-bottom: 20px;
        transition: transform 0.3s ease-in-out;
        animation: fade-in 1s ease-out 0.3s; /* Delayed fade-in animation */
      }

      .logo img:hover {
        transform: scale(1.1);
      }

      h1 {
        font-size: 26px;
        font-weight: bold;
        color: #a52a2a;
        margin-bottom: 10px;
      }

      p {
        font-size: 14px;
        color: #555;
        margin-bottom: 20px;
      }

      .button-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .button-list li {
        margin: 10px 0;
      }

      .button-list a {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(45deg, #f3ec78, #af4261);
        padding: 15px;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        transition: all 0.3s ease;
        position: relative;
      }

      .button-list a:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      }

      .button-list a img {
        width: 24px;
        height: 24px;
        margin-right: 10px;
        position: absolute;
        left: 15px;
      }

      .social-icons {
        margin-top: 20px;
        display: flex;
        justify-content: center;
      }

      .social-icons a {
        margin: 0 10px;
      }

      .social-icons img {
        width: 35px;
        transition: transform 0.3s ease-in-out;
      }

      .social-icons img:hover {
        transform: rotate(360deg) scale(1.1);
      }

      @media (max-width: 768px) {
        .container {
          max-width: 95%;
          padding: 15px;
        }

        .button-list a {
          font-size: 14px;
          padding: 12px;
        }

        .social-icons img {
          width: 28px;
        }
      }
    </style>
